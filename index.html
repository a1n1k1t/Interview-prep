<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterviewIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9ff;--panel:#ffffff;--panel-alt:#eff4ff;--text:#0b1c30;--muted:#464555;--border:#d3e4fe;--accent:#4f46e5;--accent-dark:#3525cd;--accent-soft:#e5eeff;--secondary:#712ae2;--emerald:#10b981;--emerald-soft:#ecfdf5;--amber:#f59e0b;--amber-soft:#fffbeb;--danger:#dc2626;--danger-soft:#fee2e2;--radius:1rem;--radius-sm:0.75rem;--shadow:0 1px 3px rgba(11,28,48,.06),0 4px 10px rgba(11,28,48,.05);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand b{font-family:Manrope,sans-serif}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle}
#fatalBanner{display:none;position:sticky;top:0;z-index:100;background:#fef2f2;color:#991b1b;border-bottom:1px solid #fecaca;padding:12px 20px;font-size:13px}
#fatalBanner b{display:block;margin-bottom:2px}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{width:36px;height:36px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.brand b{font-size:17px;letter-spacing:-.3px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
select,input,textarea,button{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px}
button{cursor:pointer;background:var(--accent);color:#fff;border:none;font-weight:700}
button:hover{background:var(--accent-dark)}
button:active{transform:scale(.98)}
button.sec{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);font-weight:600}
button.sec:hover{background:var(--accent-soft);opacity:1}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--border)}
nav button{background:transparent;color:var(--muted);border:none;border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;font-size:13px}
nav button.on{color:var(--accent);background:var(--accent-soft)}
main{max-width:840px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin-top:0;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin:8px 0 3px}
textarea{width:100%;min-height:80px;resize:vertical}
input,select{width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.q{font-size:22px;font-weight:800;margin:10px 0 16px;line-height:1.4;font-family:Manrope,sans-serif}
.metric{display:inline-block;background:var(--panel-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 13px;margin:3px 5px 0 0;font-size:13px;font-weight:700}
.hint{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--panel-alt);border:1px solid var(--border);font-size:12px;font-weight:700}
.pill.red{background:var(--danger-soft);color:#991b1b;border-color:#fecaca}
.pill.amber{background:var(--amber-soft);color:#92400e;border-color:#fde68a}
.pill.green{background:var(--emerald-soft);color:#065f46;border-color:#a7f3d0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;margin:2px 4px 2px 0}
.chip.strength{background:var(--emerald-soft);color:#065f46;border:1px solid #a7f3d0}
.chip.improve{background:var(--amber-soft);color:#92400e;border:1px solid #fde68a}
.alert-danger{background:var(--danger-soft);border:1px solid #fecaca;border-radius:var(--radius-sm);padding:14px 16px;margin:12px 0}
.alert-danger b{color:#991b1b;display:block;margin-bottom:4px}
.gauge{width:150px;height:150px;margin:6px auto;position:relative}
.gauge svg{transform:rotate(-90deg)}
.gauge .track{fill:none;stroke:var(--panel-alt);stroke-width:12}
.gauge .fill{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .num b{font-size:34px;font-family:Manrope,sans-serif;line-height:1}
.gauge .num span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.bar-outer{background:var(--panel-alt);border-radius:999px;height:8px;overflow:hidden;margin-top:6px}
.bar-inner{height:100%;border-radius:999px;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left}
.sess-row{border-bottom:1px solid var(--border);padding:10px 0}
.sess-row:last-child{border-bottom:none}
#rec-dot{display:none;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;margin-right:6px}
@keyframes pulse{50%{opacity:.3}}
pre{white-space:pre-wrap;font-size:12px;background:var(--panel-alt);padding:10px;border-radius:var(--radius-sm)}
.stub{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted)}
.reads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:4px}
.read-card{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--panel-alt)}
.read-card .thumb{width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;background:#fff;cursor:pointer}
.read-card .thumb iframe{width:400%;height:400%;transform:scale(.25);transform-origin:top left;border:none;pointer-events:none}
.read-card .meta{padding:8px}
.creditbar{border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--secondary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.hero-cta{background:linear-gradient(135deg,var(--accent),var(--secondary));color:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.hero-cta h3{color:#fff;margin-top:0}
.hero-cta p{color:rgba(255,255,255,.85);margin:4px 0 14px}
.hero-cta button{background:#fff;color:var(--accent-dark)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.stat-card{background:var(--panel-alt);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-card b{display:block;font-size:22px;font-family:Manrope,sans-serif}
.stat-card span{font-size:11px;color:var(--muted);font-weight:600}
.gc{border-bottom:1px solid var(--border)}
.gc-head{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0}
.gc-body{padding:2px 0 10px 14px}
.gc-item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:6px 0}
button.mini,.mini{padding:4px 9px;font-size:11px;border-radius:8px}
.chat-box{max-height:420px;min-height:120px;overflow-y:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:88%;padding:10px 13px;border-radius:var(--radius-sm);white-space:pre-wrap;font-size:14px;line-height:1.5}
.bubble.user{background:var(--accent-soft);margin-left:auto}
.bubble.ai{background:var(--panel-alt);border:1px solid var(--border)}
.bubble.err{background:var(--danger-soft);color:#991b1b}
.link-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.link-item:last-child{border-bottom:none}
.link-title{font-weight:700;color:var(--accent);text-decoration:none;word-break:break-word}
a.link-title:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="fatalBanner"><b>Something went wrong</b><span id="fatalMsg"></span></div>
<div id="authScreen" style="display:none">
  <div class="card" style="max-width:380px;margin:70px auto">
    <div class="brand" style="margin-bottom:14px"><div class="logo">🎤</div><div><b>InterviewIQ</b><small>Interview Intelligence</small></div></div>
    <h3 id="auth-title" style="margin-top:0">Sign in</h3>
    <label>Email</label><input id="auth-email" type="email">
    <label>Password</label><input id="auth-pass" type="password">
    <div class="row" style="margin-top:10px"><button onclick="doSignIn()">Sign in</button><button class="sec" onclick="doSignUp()">Create account</button></div>
    <p id="auth-err" style="color:var(--danger);font-size:13px"></p>
  </div>
</div>
<div id="appScreen" style="display:none">
  <header>
    <div class="brand"><div class="logo">🎤</div><div><b>InterviewIQ</b><small>Interview Intelligence</small></div></div>
    <div class="row">
      <span class="creditbar" id="creditBar">₹…</span>
      <button class="sec" id="voiceBtn" onclick="toggleVoice()">🔊 Off</button>
      <select id="voiceSel" onchange="setVoiceName(this.value)" style="width:auto">
        <option value="en-US-Wavenet-D">Male voice</option>
        <option value="en-US-Wavenet-F">Female voice</option>
      </select>
      <button class="sec" onclick="doSignOut()">Sign out</button>
      <div class="avatar" id="avatarDot">?</div>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
env.allowLocalModels = false;
let _p;
window.__getTranscriber = () => _p || (_p = pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en'));
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---- fill these in from your Supabase project (Settings → API) ----
const SUPABASE_URL = "https://yzsquxlhxllculklabhu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HS9_fL95YmkF4cldBuIAXA_5nzmnAU-";

function showFatal(msg){
  document.getElementById('fatalMsg').textContent = msg;
  document.getElementById('fatalBanner').style.display='block';
}
window.addEventListener('error', e => showFatal(e.message || 'Unknown script error'));
window.addEventListener('unhandledrejection', e => showFatal((e.reason && e.reason.message) || String(e.reason)));

if(SUPABASE_URL.includes('YOUR_SUPABASE_URL') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY')){
  throw new Error('SUPABASE_URL / SUPABASE_ANON_KEY are still placeholder text in index.html — paste your real Supabase Project URL and anon public key in, then redeploy.');
}
if(!/^https:\/\/[a-z0-9]+\.supabase\.co\/?$/.test(SUPABASE_URL.trim())){
  throw new Error('SUPABASE_URL looks malformed: "'+SUPABASE_URL+'" — it should look exactly like https://xxxxxxxx.supabase.co with nothing before or after it (no /rest/v1, no trailing text).');
}
const supa = supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim());

let currentUser=null, myProfile=null;
let personas=[]; let tab='dashboard'; let editingPersonaId=null;
let iv={active:false,persona:null,turns:[],qn:0,max:5,pending:null};
let rec={active:false,ctx:null,stream:null,analyser:null,recog:null,mediaRecorder:null,chunks:[],final:'',interim:'',vol:[],pitch:[],loopId:null,start:0};
const SAFETY_MAX_Q=25; // hard safety cap only — the candidate controls length via "End Interview"
let voiceOn = localStorage.getItem('ic_voice_on')==='1';
let voiceName = localStorage.getItem('ic_voice_name') || 'en-US-Wavenet-D';

// ---------- auth ----------
async function doSignIn(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  if(!email || !pass){ document.getElementById('auth-err').style.color='var(--danger)'; document.getElementById('auth-err').textContent='Enter both email and password.'; return; }
  const {error}=await supa.auth.signInWithPassword({email,password:pass});
  if(error){ document.getElementById('auth-err').style.color='var(--danger)'; document.getElementById('auth-err').textContent=error.message; return; }
  await boot();
}
async function doSignUp(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  if(!email || !pass){ document.getElementById('auth-err').style.color='var(--danger)'; document.getElementById('auth-err').textContent='Enter both email and password.'; return; }
  if(pass.length<6){ document.getElementById('auth-err').style.color='var(--danger)'; document.getElementById('auth-err').textContent='Password must be at least 6 characters.'; return; }
  const {error}=await supa.auth.signUp({email,password:pass});
  if(error){ document.getElementById('auth-err').style.color='var(--danger)'; document.getElementById('auth-err').textContent=error.message; return; }
  document.getElementById('auth-err').style.color='var(--emerald)';
  document.getElementById('auth-err').textContent='Account created. If email confirmation is on, check your inbox, then sign in.';
}
async function doSignOut(){ await supa.auth.signOut(); location.reload(); }

function toggleVoice(){
  voiceOn=!voiceOn; localStorage.setItem('ic_voice_on', voiceOn?'1':'0');
  document.getElementById('voiceBtn').textContent = voiceOn?'🔊 On':'🔊 Off';
}
function setVoiceName(v){ voiceName=v; localStorage.setItem('ic_voice_name', v); }
async function authToken(){ const {data:{session}}=await supa.auth.getSession(); return session?.access_token; }
async function speak(text){
  if(!voiceOn || !text) return;
  try{
    const token=await authToken();
    const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({text:text.slice(0,600),voice:voiceName})});
    if(!r.ok) return;
    const blob=await r.blob();
    new Audio(URL.createObjectURL(blob)).play().catch(()=>{});
  }catch(e){}
}

// ---------- ask Claude via credit-gated proxy ----------
async function askClaude(input, wantJson, useSearch){
  const token=await authToken();
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({input,json:!!wantJson,search:!!useSearch})});
  const data=await r.json();
  if(!r.ok) throw new Error(typeof data.error==='string'?data.error:JSON.stringify(data.error));
  return wantJson ? data : {text:data.text};
}
async function fetchRecommendations(x, useSearch){
  const prompt=`Give 3 short, concrete recommendations to improve this candidate's interview performance.
Metrics — pace ${x.wpm} wpm, fillers ${x.fillers}, pauses ${x.pauseCount||0} (${x.pauseSec||0}s total), pitch variation ${x.pVar}Hz.
Summary: ${x.summary||''}
Noted improvements: ${(x.improvements||[]).join('; ')}
${x.transcript?'Transcript:\n'+x.transcript.slice(0,3000):''}
Keep it practical and specific, not generic advice.`;
  const r=await askClaude(prompt,false,useSearch);
  x.recommendations=r.text;
  if(x._rowId){ try{ await supa.from('sessions').update({data:x}).eq('id',x._rowId); }catch(e){} }
  return x.recommendations;
}
async function refreshCredits(){
  let {data}=await supa.from('profiles').select('email,credits_inr,is_admin,growth_areas').eq('id',currentUser.id).single();
  if(!data){
    // profile row created by a DB trigger on signup — occasionally not ready yet, retry once
    await new Promise(r=>setTimeout(r,900));
    ({data}=await supa.from('profiles').select('email,credits_inr,is_admin,growth_areas').eq('id',currentUser.id).single());
  }
  if(!data){
    showFatal('Your account exists but no profile record was found yet. Wait a few seconds and reload the page. If this persists, check that the on_auth_user_created trigger ran (see supabase-setup.sql).');
    return;
  }
  myProfile=data;
  document.getElementById('creditBar').textContent = myProfile.is_admin?'∞ Admin':('₹'+Math.max(0,myProfile.credits_inr).toFixed(2));
  document.getElementById('avatarDot').textContent = (myProfile.email||'?')[0].toUpperCase();
}

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clip(s,n){ return String(s||'').replace(/\s+/g,' ').trim().slice(0,n); }

// ---------- growth-area tracking (grouped by pattern) ----------
const GROWTH_THEMES=[
 {id:'fact',label:'Factual accuracy',kw:['fact*','incorrect*','inaccura*','wrong','error*','mistake*','misstat*','false','misquot*']},
 {id:'quant',label:'Quantified results & numbers',kw:['number*','metric*','quantif*','data','statistic*','percent*','figure*','measur*','kpi*','roi','numeric*']},
 {id:'specific',label:'Specific examples & evidence',kw:['example*','instance*','evidence','specific*','concrete','vague','generic','shallow','detail*','anecdot*','abstract','theoretic*','conceptual','circl*','unsupported','substantiat*']},
 {id:'ramble',label:'Conciseness & focus',kw:['rambl*','lengthy','long winded','verbose','concis*','brevity','wordy','repetit*','repeat*','unfocus*']},
 {id:'direct',label:'Answering the question asked',kw:['deflect*','evad*','direct*','relevan*','tangent*','sidestep*','dodg*','unanswer*','answer*']},
 {id:'structure',label:'Structure & frameworks',kw:['structur*','framework*','star','mece','organi*','logic*','flow','sequenc*','outline','signpost*']},
 {id:'owner',label:'Ownership & personal contribution',kw:['ownership','owner*','contribution*','accountab*','credit','we vs i','i vs we','team effort','your role','personal role']},
 {id:'hedge',label:'Confident, decisive language',kw:['confiden*','hedg*','uncertain*','tentative*','unsure','hesita*','assertive*','decisive*','apolog*','defensive*','waver*','backtrack*','qualif*','wishy washy']},
 {id:'knowledge',label:'Company & domain knowledge',kw:['knowledge','research*','company','domain','industry','market*','awareness','familiar*','prepar*','unprepared','understand*','insight*']},
 {id:'filler',label:'Filler words',kw:['filler*','um','uh','umm']},
 {id:'pace',label:'Speaking pace',kw:['pace','pacing','fast','slow','rushed','rushing','tempo','wpm']},
 {id:'pause',label:'Pauses & silence',kw:['pause*','silence*','silent']},
 {id:'pitch',label:'Vocal variety & tone',kw:['pitch','monoton*','tone','inflection','modulat*','vocal','energy','flat','intonation']}
];
const STOPWORDS=new Set('the a an and or of to in on for with at by from is are was were be been it this that these those as your you their they he she we i not no but so if then than too very more most can could should would may might do does did have has had into about over under between during his her its our my me'.split(' '));
function normText(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function kwMatch(kw,norm,tokens){
  if(kw.indexOf(' ')>=0) return (' '+norm+' ').indexOf(' '+kw+' ')>=0;
  if(kw.slice(-1)==='*'){ const p=kw.slice(0,-1); return tokens.some(t=>t.indexOf(p)===0); }
  return tokens.indexOf(kw)>=0;
}
function themeOf(text){
  const norm=normText(text), tokens=norm.split(' ').filter(Boolean);
  for(const th of GROWTH_THEMES){ if(th.kw.some(k=>kwMatch(k,norm,tokens))) return th; }
  return null;
}
function stemSet(text){
  return new Set(normText(text).split(' ').filter(t=>t.length>2&&!STOPWORDS.has(t)).map(t=>t.slice(0,5)));
}
function jaccard(a,b){ let i=0; a.forEach(x=>{ if(b.has(x)) i++; }); const u=a.size+b.size-i; return u?i/u:0; }
function findSimilarIdx(text,areas){
  const exact=areas.findIndex(x=>x.area===text); if(exact>=0) return exact;
  const s=stemSet(text); let best=-1,bestScore=0;
  areas.forEach((x,i)=>{ const j=jaccard(s,stemSet(x.area)); if(j>bestScore){ bestScore=j; best=i; } });
  return bestScore>=0.5?best:-1;
}
function reconcileGrowth(existing, upd){
  const now=new Date().toISOString();
  const areas=(existing||[]).map(a=>({...a}));
  const bump=(text,reopen)=>{
    const i=findSimilarIdx(text,areas);
    if(i>=0){
      if(areas[i].ignored) return; // ignored areas stay hidden and don't come back under new wording
      areas[i].timesNoted=(areas[i].timesNoted||1)+1; areas[i].lastNoted=now;
      areas[i].status=(areas[i].status==='resolved'&&reopen)?'new':'unchanged';
    }else areas.push({area:text,firstNoted:now,lastNoted:now,timesNoted:1,status:'new'});
  };
  (upd.stillPresent||[]).forEach(a=>bump(a,false));
  (upd.resolved||[]).forEach(a=>{
    const i=areas.findIndex(x=>x.area===a);
    if(i>=0&&!areas[i].ignored){ areas[i].status='resolved'; areas[i].lastNoted=now; }
  });
  (upd.newIssues||[]).forEach(a=>bump(a,true));
  return areas;
}
async function saveGrowthAreas(areas){
  myProfile.growth_areas=areas;
  const token=await authToken();
  try{ await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({saveGrowthAreas:areas})}); }catch(e){}
}
function buildGrowthClusters(areas){
  const byTheme=new Map(), leftovers=[];
  (areas||[]).forEach((a,idx)=>{
    if(a.status==='resolved'||a.ignored) return;
    const th=themeOf(a.area);
    if(th){ if(!byTheme.has(th.id)) byTheme.set(th.id,{key:th.id,label:th.label,items:[]}); byTheme.get(th.id).items.push(idx); }
    else leftovers.push(idx);
  });
  const reps=[];
  leftovers.sort((i,j)=>(areas[j].timesNoted||1)-(areas[i].timesNoted||1)).forEach(idx=>{
    const s=stemSet(areas[idx].area);
    const hit=reps.find(r=>jaccard(r.set,s)>=0.34);
    if(hit) hit.items.push(idx); else reps.push({key:'x'+idx,label:areas[idx].area,set:s,items:[idx]});
  });
  const clusters=[...byTheme.values(),...reps.map(r=>({key:r.key,label:r.label,items:r.items}))];
  clusters.forEach(c=>{
    c.items.sort((i,j)=>(areas[j].timesNoted||1)-(areas[i].timesNoted||1));
    c.total=c.items.reduce((n,i)=>n+(areas[i].timesNoted||1),0);
  });
  clusters.sort((a,b)=>b.total-a.total);
  return clusters;
}
let openClusters=new Set(), showAllClusters=false, showIgnoredList=false;
function growthPanelInner(){
  const areas=myProfile.growth_areas||[];

  return `<div class="card"><h3>Your growth areas</h3>

// ---------- audio capture (with free in-browser transcription fallback) ----------
function autoCorrelate(buf,sr){
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length); if(rms<0.01) return {pitch:-1,rms};
  let r1=0,r2=buf.length-1,th=0.2;
  for(let i=0;i<buf.length/2;i++) if(Math.abs(buf[i])<th){r1=i;break;}
  for(let i=1;i<buf.length/2;i++) if(Math.abs(buf[buf.length-i])<th){r2=buf.length-i;break;}
  const b=buf.slice(r1,r2), n=b.length; if(n<8) return {pitch:-1,rms};
  const c=new Array(n).fill(0);
  for(let i=0;i<n;i++) for(let j=0;j<n-i;j++) c[i]+=b[j]*b[j+i];
  let d=0; while(d<n-1 && c[d]>c[d+1]) d++;
  let mv=-1,mp=-1;
  for(let i=d;i<n;i++) if(c[i]>mv){mv=c[i];mp=i;}
  if(mp<=0) return {pitch:-1,rms};
  const f=sr/mp;
  return {pitch:(f>60&&f<500)?f:-1, rms};
}
async function whisperTranscribe(blob){
  const arrayBuffer=await blob.arrayBuffer();
  const tempCtx=new (window.AudioContext||window.webkitAudioContext)();
  const audioBuffer=await tempCtx.decodeAudioData(arrayBuffer);
  const offline=new OfflineAudioContext(1, Math.ceil(audioBuffer.duration*16000), 16000);
  const src=offline.createBufferSource(); src.buffer=audioBuffer; src.connect(offline.destination); src.start();
  const rendered=await offline.startRendering();
  tempCtx.close();
  const pcm=rendered.getChannelData(0);
  const transcriber=await window.__getTranscriber();
  const result=await transcriber(pcm,{chunk_length_s:30,stride_length_s:5});
  return result.text||'';
}
async function startCapture(onTranscript){
  rec.stream=await navigator.mediaDevices.getUserMedia({audio:true});
  rec.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=rec.ctx.createMediaStreamSource(rec.stream);
  rec.analyser=rec.ctx.createAnalyser(); rec.analyser.fftSize=2048;
  src.connect(rec.analyser);
  rec.vol=[]; rec.pitch=[]; rec.final=''; rec.interim=''; rec.start=Date.now(); rec.active=true;
  const buf=new Float32Array(rec.analyser.fftSize);
  rec.loopId=setInterval(()=>{
    rec.analyser.getFloatTimeDomainData(buf);
    const {pitch,rms}=autoCorrelate(buf,rec.ctx.sampleRate);
    rec.vol.push(rms); if(pitch>0) rec.pitch.push(pitch);
  },100);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(SR && !isMobile){
    rec.recog=new SR(); rec.recog.continuous=true; rec.recog.interimResults=true; rec.recog.lang='en-US';
    rec.recog.onresult=(e)=>{
      let inter='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) rec.final+=e.results[i][0].transcript+' ';
        else inter+=e.results[i][0].transcript;
      }
      rec.interim=inter; onTranscript && onTranscript(rec.final+rec.interim);
    };
    rec.recog.onerror=()=>{};
    rec.recog.onend=()=>{ if(rec.active){ try{ rec.recog.start(); }catch(e){} } }; // Chrome silently drops long sessions — restart seamlessly if still recording
    rec.recog.start();
  }else{
    rec.chunks=[];
    const mt = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
    rec.mediaRecorder=new MediaRecorder(rec.stream, mt?{mimeType:mt}:undefined);
    rec.mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) rec.chunks.push(e.data); };
    rec.mediaRecorder.start();
    onTranscript && onTranscript('(recording — will transcribe on-device after you stop; first time on this phone takes longer while it downloads a small model)');
  }
}
async function stopCapture(){
  rec.active=false;
  if(rec.loopId) clearInterval(rec.loopId);
  let transcript='';
  if(rec.recog){ try{rec.recog.stop();}catch(e){} transcript=(rec.final+rec.interim).trim(); }
  else if(rec.mediaRecorder){
    await new Promise(resolve=>{ rec.mediaRecorder.onstop=resolve; rec.mediaRecorder.stop(); });
    const blob=new Blob(rec.chunks,{type:rec.mediaRecorder.mimeType||'audio/webm'});
    try{ transcript=await whisperTranscribe(blob); }catch(e){ transcript=''; }
  }
  if(rec.stream) rec.stream.getTracks().forEach(t=>t.stop());
  if(rec.ctx) rec.ctx.close();
  const durationSec=Math.max(1,(Date.now()-rec.start)/1000);
  const words=transcript?transcript.split(/\s+/).filter(Boolean):[];
  const wpm=Math.round(words.length/(durationSec/60));
  const fillers=(transcript.match(/\b(um+|uh+|like|you know|basically|i mean)\b/gi)||[]).length;
  const avgVol=rec.vol.length?rec.vol.reduce((a,b)=>a+b,0)/rec.vol.length:0;
  const pMean=rec.pitch.length?rec.pitch.reduce((a,b)=>a+b,0)/rec.pitch.length:0;
  const pVar=rec.pitch.length>1?Math.sqrt(rec.pitch.reduce((a,b)=>a+(b-pMean)**2,0)/rec.pitch.length):0;
  let pauseCount=0,pauseSec=0,silentRun=0;
  rec.vol.forEach(v=>{ if(v<0.015) silentRun++; else { if(silentRun>=12){pauseCount++;pauseSec+=silentRun*0.1;} silentRun=0; } });
  if(silentRun>=12){ pauseCount++; pauseSec+=silentRun*0.1; }
  return {transcript,durationSec:Math.round(durationSec),wordCount:words.length,wpm:isFinite(wpm)?wpm:0,fillers,avgVol,pMean:Math.round(pMean),pVar:Math.round(pVar),pauseCount,pauseSec:Math.round(pauseSec)};
}
function scoreMetrics(m){
  const pace=Math.max(0,100-Math.abs(m.wpm-135)*1.2);
  const fillerRate=m.wordCount?m.fillers/m.wordCount*100:0;
  const fillerScore=Math.max(0,100-fillerRate*12);
  const pitchScore=m.pVar>10&&m.pVar<70?90:m.pVar<=10?40:65;
  return {pace:Math.round(pace),fillerScore:Math.round(fillerScore),pitchScore:Math.round(pitchScore),fillerRate:Math.round(fillerRate)};
}

// ---------- mock interview ----------
function toughLabel(id){ return {gentle:'Easy',realistic:'Mid',tough:'Tough'}[id]||id; }
function buildRules(p, toughnessId, mode){
  const level = toughnessId || p.toughness || 'realistic';
  const tone={
    gentle:"DIFFICULTY: Easy. Tone: warm and encouraging — but still ask substantive questions and expect real answers; do not make this trivially easy or skip follow-ups. Give the candidate room to recover from a shaky start before pushing further.",
    realistic:"DIFFICULTY: Mid. Tone: professional and neutral, like a real hiring manager — courteous but not overly warm, roughly balanced between supportive and challenging. Push for specifics when an answer is vague.",
    tough:"DIFFICULTY: Tough. Tone: rigorous, like a senior panel interviewer under time pressure. Rarely praise. Use sharp follow-ups on weak answers. Additionally: silently fact-check any verifiable claim the candidate makes (numbers, named frameworks, company facts, financial/technical concepts). If a stated fact is wrong, don't let it pass — open your NEXT question with a brief, professional correction before moving on (e.g. \"Just to correct one thing — WACC uses market values, not book values — now, on your next point...\")."
  }[level];
  const fullModeBlock = mode==='full' ? `

FULL INTERVIEW STRUCTURE — this is a "Full Interview": simulate the complete arc of a real interview, not just role-specific questions from the start:
- Question 1: open with a broad rapport-building question — "Tell me about yourself" or "Tell me something interesting about you that isn't on your resume/CV." This is NOT about the role yet, it's how a real interview actually opens.
- After that answer, silently judge it: if it revealed something genuinely notable, unusual, or impressive (a specific project, achievement, or experience worth exploring), ask ONE more follow-up digging into that specific thing before moving on. If the answer was generic or thin, move on immediately — don't force a second rapport question just for the sake of it.
- Over the next 1-2 questions, bridge naturally from what they shared toward the role — pick up a thread from their background and connect it to why they want this role, or ask directly why they're interested in it.
- From there onward, conduct the substantive role-specific interview using the framework and evaluate-and-pivot approach described below.
- Never spend more than 3 questions total in this rapport/bridging phase before you're fully into role-specific territory — the transcript so far tells you how many questions have already happened.` : `

HALF INTERVIEW — start directly with role-specific questions per the framework below; skip general rapport-building, this session goes straight to substance.`;
  return `You are role-playing as an experienced human interviewer/recruiter for the role of ${p.role} ${p.company?"at "+p.company:""}.
${p.jdText?"Job description / round notes:\n"+p.jdText+"\n":""}
${tone}
${fullModeBlock}

HOW TO CONDUCT THE ROLE-SPECIFIC PART OF THIS INTERVIEW:
- Make each role-specific question open-ended — invite a substantive answer, not a yes/no.
- After EVERY answer, silently evaluate it before asking the next question: (1) did they actually answer what was asked, or deflect to a rehearsed talking point? (2) is the answer shallow/vague, or comprehensive and specific? (3) is any stated fact, number, or framework wrong?
- Then choose your next move accordingly: if shallow or vague, demand a concrete example or a specific number instead of jumping to a new topic. If strong and complete, pivot — introduce a related angle, a sudden constraint, or a natural follow-up building on what they said, rather than a disconnected new question. If a claim was factually wrong, address it per the difficulty setting above.
- Apply the professional framework relevant to this role where it fits (e.g. STAR for behavioral stories, MECE/structured issue trees for case-style business questions, correct financial/valuation logic for finance roles) and judge structure, not just content.
- Ask ONE question per turn. Output ONLY the question text — no preamble, no numbering, no meta-commentary, no labels like "Question:".`;
}
function changeToughness(level){
  iv.toughness=level;
  iv.turns[0]={role:"user",content:buildRules(iv.persona,level,iv.mode)+"\n[Note: the candidate just changed the difficulty to '"+toughLabel(level)+"' mid-interview — apply this from your NEXT question onward.]"};
  renderInterview();
}
async function beginInterview(personaId, mode){
  const p=personas.find(x=>x.id===personaId); if(!p) return;
  const lvl=p.toughness||'realistic';
  iv={active:true,persona:p,toughness:lvl,mode:mode||'half',turns:[{role:"user",content:buildRules(p,lvl,mode)+"\nAsk your first question now."}],qn:0,lastMetrics:[],error:null};
  renderInterview(); await askQuestion();
}
async function askQuestion(){
  renderInterview(true);
  try{
    const r=await askClaude(iv.turns);
    iv.turns.push({role:"assistant",content:r.text});
    iv.qn++;
    speak(r.text);
    await refreshCredits();
  }catch(e){ iv.error="Error: "+e.message; }
  renderInterview();
}
async function toggleRecordAndSubmit(cb){
  if(!rec.active){ await startCapture(t=>{const el=document.getElementById('live-t'); if(el) el.textContent=t;}); document.getElementById('rec-dot').style.display='inline-block'; renderInterview(); return; }
  document.getElementById('rec-dot').style.display='none';
  const liveEl=document.getElementById('live-t'); if(liveEl) liveEl.textContent='Processing…';
  const m=await stopCapture();
  cb(m);
}
async function submitAnswer(){
  if(!rec.active){ await toggleRecordAndSubmit(); return; }
  await toggleRecordAndSubmit(async(m)=>{
    if(!m.transcript){ const t=prompt("No speech captured — type your answer:"); if(t) m.transcript=t; else {renderInterview();return;} }
    iv.turns.push({role:"user",content:m.transcript});
    iv.lastMetrics=iv.lastMetrics||[]; iv.lastMetrics.push(m);
    if(iv.qn>=SAFETY_MAX_Q){ await finishInterview(); return; } // safety cap only — otherwise the candidate decides when to stop
    await askQuestion();
  });
}
function endInterviewNow(){
  if(!iv.lastMetrics || !iv.lastMetrics.length){ alert('Answer at least one question before ending.'); return; }
  finishInterview();
}
async function finishInterview(){
  document.getElementById('main').innerHTML='<div class="card">Scoring your interview…</div>';
  const transcript=iv.turns.slice(1).map(t=>(t.role==='assistant'?'Interviewer: ':'You: ')+t.content).join('\n\n');
  const agg=aggregate(iv.lastMetrics||[]);
  const tracked=(myProfile.growth_areas||[]).filter(a=>a.status!=='resolved'&&!a.ignored).sort((a,b)=>(b.timesNoted||0)-(a.timesNoted||0)).slice(0,8);
  const growthContext=tracked.length
    ? `Tracked recurring weak areas from previous sessions (top ${tracked.length}):\n${tracked.map(g=>`- "${g.area}" (noted ${g.timesNoted}x)`).join('\n')}\n`
    : 'No prior tracked weaknesses yet — this may be their first session.\n';
  let fb={overallScore:60,contentScore:60,structureScore:60,confidenceScore:60,strengths:[],improvements:[],factCheck:[],summary:"",growthUpdate:{}};
  try{
    fb=await askClaude(`You are a strict, honest interview coach. Before scoring, first extract specific factual evidence from the transcript — do NOT score based on answer length or polished style; a short, precise answer should score as well as or better than a long rambling one if the underlying content is stronger. Be direct about real weaknesses; only praise what is genuinely strong.

Here is the full interview transcript:
${transcript.slice(0,8000)}

${growthContext}
Also review the transcript for any factual, numerical, or conceptual errors the CANDIDATE (not the interviewer) stated — flag every one you find, however small.

Give JSON only: {"overallScore":0-100,"contentScore":0-100,"structureScore":0-100,"confidenceScore":0-100,"strengths":[3 short strings],"improvements":[3 short strings],"factCheck":["specific factual errors the candidate made — quote or paraphrase the wrong claim and give the correction; empty array if none"],"summary":"2 sentence honest summary","growthUpdate":{"stillPresent":["exact text of tracked areas above still showing in THIS session"],"resolved":["exact text of tracked areas that seem fixed now"],"newIssues":["new recurring-worthy weakness as a short generic 3-8 word phrase; if it is the same issue as one in the tracked list, reuse that exact wording"]}}`,true);
    fb={...{overallScore:60,contentScore:60,structureScore:60,confidenceScore:60,strengths:[],improvements:[],factCheck:[],summary:"",growthUpdate:{}}, ...fb};
  }catch(e){}
  const scores=scoreMetrics(agg);
  const session={kind:"interview",personaLabel:iv.persona.label,mode:iv.mode,createdAt:new Date().toISOString(),transcript,...agg,...scores,...fb};
  try{
    const {data}=await supa.from('sessions').insert({user_id:currentUser.id,kind:session.kind,data:session}).select().single();
    if(data) session._rowId=data.id;
  }catch(e){}
  if(fb.growthUpdate){ const updated=reconcileGrowth(myProfile.growth_areas, fb.growthUpdate); await saveGrowthAreas(updated); }
  await refreshCredits();
  iv.active=false; iv.result=session;
  renderInterview();
}
function aggregate(list){
  if(!list.length) return {wpm:0,fillers:0,wordCount:0,pVar:0,avgVol:0,durationSec:0,pauseCount:0,pauseSec:0};
  const s={wpm:0,fillers:0,wordCount:0,pVar:0,avgVol:0,durationSec:0,pauseCount:0,pauseSec:0};
  list.forEach(m=>{s.wpm+=m.wpm;s.fillers+=m.fillers;s.wordCount+=m.wordCount;s.pVar+=m.pVar;s.avgVol+=m.avgVol;s.durationSec+=m.durationSec;s.pauseCount+=m.pauseCount||0;s.pauseSec+=m.pauseSec||0;});
  s.wpm=Math.round(s.wpm/list.length); s.pVar=Math.round(s.pVar/list.length); s.avgVol=s.avgVol/list.length;
  return s;
}

function svgGauge(score){
  const r=60, c=2*Math.PI*r, off=c*(1-Math.min(100,Math.max(0,score||0))/100);
  return `<div class="gauge"><svg width="150" height="150" viewBox="0 0 150 150">
  <circle class="track" cx="75" cy="75" r="${r}"></circle>
  <circle class="fill" cx="75" cy="75" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
  </svg><div class="num"><b>${score}</b><span>/ 100</span></div></div>`;
}
function subBar(label, val){
  return `<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><span style="font-weight:600;font-size:13px">${label}</span><span style="font-weight:700;font-size:13px">${val}/100</span></div><div class="bar-outer"><div class="bar-inner" style="width:${val}%"></div></div></div>`;
}

let histSessions=[];
function sparkline(vals,color){
  if(vals.length<2) return '<p class="hint">Need more sessions for a trend.</p>';
  const max=Math.max(...vals,1), min=Math.min(...vals,0), w=260, h=44;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/((max-min)||1))*h}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:44px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/></svg>`;
}

async function renderHistory(){
  const el=document.getElementById('main');
  el.innerHTML='<div class="card">Loading…</div>';
  const {data}=await supa.from('sessions').select('id,data').eq('user_id',currentUser.id).neq('kind','coach_chat').order('created_at',{ascending:false}).limit(50);
  const s=(data||[]).map(r=>({...r.data,_rowId:r.id}));
  histSessions=s;
  if(!s.length){ el.innerHTML='<div class="card">No sessions yet — do a mock interview or audio analysis first.</div>'; return; }
  const avg=k=>Math.round(s.reduce((a,x)=>a+(x[k]||0),0)/s.length);
  const chrono=s.slice().reverse();
  const allImprove=s.flatMap(x=>x.improvements||[]).map(t=>t.trim());
  const freq={}; allImprove.forEach(t=>{const k=t.toLowerCase(); freq[k]=freq[k]?{c:freq[k].c+1,t}:{c:1,t};});
  const themes=Object.values(freq).filter(v=>v.c>1).sort((a,b)=>b.c-a.c).slice(0,3);
  el.innerHTML=`<div class="card"><h3>Averages (${s.length} sessions)</h3>
  <div class="metric">Overall ${avg('overallScore')}/100</div>
  <div class="metric">Pace ${avg('wpm')} wpm <span class="hint">(ideal 120–150)</span></div>
  <div class="metric">Fillers ${avg('fillers')}</div>
  <div class="metric">Pitch var ${avg('pVar')}Hz <span class="hint">(ideal 15–70)</span></div>
  <div class="metric">Pauses ${avg('pauseCount')} (~${avg('pauseSec')}s)</div></div>

  ${renderGrowthPanel()}
  <div class="card"><h3>Session log</h3>${s.map((x,i)=>renderSessionRow(x,i)).join('')}</div>`;

async function uploadRead(kind, inputId, titleId){

  const title=document.getElementById(titleId).value.trim()||file.name;
  const path=`${kind}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const {error:upErr}=await supa.storage.from('reads').upload(path,file,{contentType:'application/pdf'});

  const {error:insErr}=await supa.from('reads').insert({kind,title,storage_path:path,uploaded_by:currentUser.id});

let linksCache=[];
function parseLink(r){ const parts=String(r.body_text||'').split('\n'); return {url:parts[0].trim(), note:parts.slice(1).join('\n').trim()}; }
function cleanUrl(u){
  u=String(u||'').trim(); if(!u) return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u='https://'+u;
  try{ const x=new URL(u); return (x.protocol==='http:'||x.protocol==='https:')?x.href:null; }catch(e){ return null; }
}
async function addLink(){
  const title=document.getElementById('link-title').value.trim();
  const url=cleanUrl(document.getElementById('link-url').value);
  const note=document.getElementById('link-note').value.trim();
  if(!title){ alert('Add a short title so people know what this link is.'); return; }
  if(!url){ alert('Enter a valid link (http:// or https://).'); return; }
  const {error}=await supa.from('reads').insert({kind:'link',title,body_text:url+(note?'\n'+note:''),uploaded_by:currentUser.id});
  if(error){ alert('Failed: '+error.message); return; }
  await go('reads');
}
async function editLink(i){
  const r=linksCache[i], l=parseLink(r);
  const t=prompt('Title:',r.title); if(t===null||!t.trim()) return;
  const u=prompt('Link:',l.url); if(u===null) return;
  const url=cleanUrl(u); if(!url){ alert('That is not a valid link.'); return; }
  const n=prompt('Short note (optional):',l.note); if(n===null) return;
  await supa.from('reads').update({title:t.trim(),body_text:url+(n.trim()?'\n'+n.trim():'')}).eq('id',r.id);
  await go('reads');
}
function renderLinksSection(items){
  linksCache=items; const isAdmin=myProfile.is_admin;
  return `<div class="card"><h3>Useful Links</h3><p class="hint">Hand-picked articles and videos. Tap a title to open it in a new tab.</p>
  ${isAdmin?`<div style="margin-bottom:10px"><input type="text" id="link-title" placeholder="Short title (e.g. How Maggi won back India)"><input type="text" id="link-url" placeholder="https://…" style="margin-top:6px"><input type="text" id="link-note" placeholder="Optional note" style="margin-top:6px"><button style="margin-top:6px" onclick="addLink()">Add link</button></div>`:''}
  ${items.length?items.map((r,i)=>{
    const l=parseLink(r), safe=cleanUrl(l.url); let host=''; try{ host=new URL(safe).hostname.replace(/^www\./,''); }catch(e){}
    return `<div class="link-item"><div style="min-width:0">${safe?`<a class="link-title" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a>`:`<span class="link-title">${esc(r.title)}</span>`}<div class="hint">${esc(host)}${l.note?' · '+esc(l.note):''}</div></div>
    ${isAdmin?`<div class="row" style="flex-wrap:nowrap"><button class="sec mini" onclick="editLink(${i})">Edit</button><button class="sec mini" onclick="deleteRead('${r.id}',null)">Delete</button></div>`:''}</div>`;
  }).join(''):`<p class="hint">No links yet${isAdmin?' — add one above.':', check back later.'}</p>`}
  </div>`;
}

// ---------- admin-only coach chat (cheap context: compact digest + retrieved excerpts) ----------
let coach={sessions:null,msgs:[],busy:false,rowId:null,threads:[],used:0,limit:3,bonus:0};
const COACH_DEFAULT_LIMIT=3;
async function getCfg(kind,title){ const {data}=await supa.from('reads').select('id,body_text').eq('kind',kind).eq('title',title).limit(1); return data&&data[0]?data[0]:null; }
async function setCfg(kind,title,val){ const row=await getCfg(kind,title); if(row) await supa.from('reads').update({body_text:String(val)}).eq('id',row.id); else await supa.from('reads').insert({kind,title,body_text:String(val),uploaded_by:currentUser.id}); }
async function coachLoadMeta(){
  const {data}=await supa.from('sessions').select('id,data,created_at').eq('user_id',currentUser.id).eq('kind','coach_chat').order('created_at',{ascending:false}).limit(60);
  coach.threads=(data||[]).map(r=>({id:r.id,title:r.data.title||'Chat',msgs:r.data.msgs||[],ts:r.data.updatedAt||r.created_at}));
  coach.used=coach.threads.reduce((n,t)=>n+t.msgs.filter(m=>m.role==='user').length,0);
  const d=await getCfg('coach_config','default'), b=await getCfg('coach_quota',currentUser.id);
  coach.limit=d&&!isNaN(d.body_text)?Number(d.body_text):COACH_DEFAULT_LIMIT;
  coach.bonus=b&&!isNaN(b.body_text)?Number(b.body_text):0;
}
function coachLeft(){ return myProfile.is_admin?Infinity:Math.max(0,coach.limit+coach.bonus-coach.used); }
async function coachSave(){
  const msgs=coach.msgs.filter(m=>!m.err).map(m=>({role:m.role,content:m.content}));
  const first=msgs.find(m=>m.role==='user');
  const data={kind:'coach_chat',title:clip(first?first.content:'Chat',45),msgs,updatedAt:new Date().toISOString()};
  if(coach.rowId){ await supa.from('sessions').update({data}).eq('id',coach.rowId); }
  else{ const {data:row}=await supa.from('sessions').insert({user_id:currentUser.id,kind:'coach_chat',data}).select().single(); if(row) coach.rowId=row.id; }
  await coachLoadMeta();
}
function coachOpen(i){ const t=coach.threads[i]; if(!t||coach.busy) return; coach.rowId=t.id; coach.msgs=t.msgs.map(m=>({...m})); renderCoach(true); }
function coachNew(){ if(coach.busy) return; coach.rowId=null; coach.msgs=[]; renderCoach(true); }
const COACH_CHIPS=['Where am I weakest on confidence?','Which weakness keeps repeating, and what drill fixes it?','What has improved over my last 5 sessions?','What do my fact errors have in common?'];
async function loadCoachData(force){
  if(coach.sessions&&!force) return;
  const {data}=await supa.from('sessions').select('data,created_at').eq('user_id',currentUser.id).neq('kind','coach_chat').order('created_at',{ascending:false}).limit(40);
  coach.sessions=(data||[]).map(r=>({...r.data,_ts:r.created_at}));
}
function avgOf(arr,k){ const v=arr.map(x=>x[k]).filter(n=>typeof n==='number'&&isFinite(n)); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function trendLine(label,arr,k,digits){
  const a=avgOf(arr.slice(0,5),k); if(a===null) return null;
  const b=avgOf(arr.slice(5,10),k);
  return label+': last5 '+a.toFixed(digits)+(b!==null?' vs prev5 '+b.toFixed(digits)+' ('+(a>=b?'+':'')+(a-b).toFixed(digits)+')':'');
}
function buildCoachDigest(){
  const s=coach.sessions||[];
  if(!s.length) return 'No sessions recorded yet.';
  const d=s.map(x=>({...x,fr:x.wordCount?x.fillers/x.wordCount*100:null,ppm:x.durationSec?(x.pauseCount||0)/(x.durationSec/60):null}));
  const trends=[trendLine('overall',d,'overallScore',0),trendLine('content',d,'contentScore',0),trendLine('structure',d,'structureScore',0),trendLine('language confidence (judged from wording only)',d,'confidenceScore',0),trendLine('pace wpm',d,'wpm',0),trendLine('fillers per 100 words',d,'fr',1),trendLine('pauses per minute',d,'ppm',1),trendLine('pitch variation Hz',d,'pVar',0)].filter(Boolean);
  const ga=myProfile.growth_areas||[];
  const themes=buildGrowthClusters(ga).slice(0,8).map(c=>'- '+c.label+' ('+c.total+'x): '+c.items.slice(0,2).map(i=>clip(ga[i].area,70)).join('; '));
  const lines=d.slice(0,25).map((x,i)=>'S'+(i+1)+' '+new Date(x.createdAt||x._ts).toLocaleDateString('en-GB')+' '+(x.kind==='interview'?'interview/'+(x.mode||'half')+' '+clip(x.personaLabel,40):'audio '+clip(x.topic,40))+' | overall '+(x.overallScore==null?'-':x.overallScore)+(x.kind==='interview'?' content '+(x.contentScore==null?'-':x.contentScore)+' struct '+(x.structureScore==null?'-':x.structureScore)+' conf '+(x.confidenceScore==null?'-':x.confidenceScore):'')+' | wpm '+(x.wpm==null?'-':x.wpm)+' fill/100w '+(x.fr==null?'-':x.fr.toFixed(1))+' pause/min '+(x.ppm==null?'-':x.ppm.toFixed(1))+' pitchSD '+(x.pVar==null?'-':x.pVar)+'Hz | '+clip(x.summary,200)+' | improve: '+(x.improvements||[]).slice(0,3).map(t=>clip(t,80)).join('; ')+((x.factCheck&&x.factCheck.length)?' | fact errors: '+x.factCheck.slice(0,2).map(t=>clip(t,100)).join('; '):''));
  return 'TRENDS (newest 5 vs previous 5 sessions)\n'+trends.join('\n')+'\n\nGROWTH THEMES\n'+(themes.join('\n')||'none')+'\n\nSESSIONS (S1 = newest)\n'+lines.join('\n');
}
function coachSnippets(q){
  const qs=stemSet(q), wantsConf=/confiden|hedg|assertiv|decisive|hesita/i.test(q);
  const HEDGE=/\b(i think|maybe|kind of|sort of|not sure|i guess|probably|perhaps|might be|i feel like)\b/gi;
  const chunks=[];
  (coach.sessions||[]).slice(0,25).forEach((x,si)=>{
    if(!x.transcript) return;
    const when=new Date(x.createdAt||x._ts).toLocaleDateString('en-GB'), pairs=[];
    if(x.kind==='interview'){
      const parts=x.transcript.split('\n\n');
      parts.forEach((p,i)=>{ if(p.indexOf('You: ')===0){ const prev=parts[i-1]||''; pairs.push({q:prev.indexOf('Interviewer: ')===0?prev.slice(13):'',a:p.slice(5)}); } });
    }else pairs.push({q:x.topic||'',a:x.transcript});
    pairs.forEach(pr=>{
      const cs=stemSet(pr.q+' '+pr.a); let score=0; qs.forEach(t=>{ if(cs.has(t)) score++; });
      if(wantsConf) score+=Math.min(4,(pr.a.match(HEDGE)||[]).length);
      if(score>=2) chunks.push({score,tag:'S'+(si+1)+' '+when,q:pr.q,a:pr.a});
    });
  });
  chunks.sort((a,b)=>b.score-a.score);
  return chunks.slice(0,4).map(c=>'['+c.tag+'] Q: '+clip(c.q,200)+'\nA: '+clip(c.a,700)).join('\n\n');
}
async function coachSend(text){
  if(coachLeft()<=0){ coach.msgs.push({role:'assistant',content:'You have used all your coach prompts. Ask the admin for more.',err:true}); renderCoachMsgs(); return; }
  coach.msgs.push({role:'user',content:text}); coach.busy=true; renderCoachMsgs();
  try{
    await loadCoachData(false);
    const rules='You are a direct, practical communication coach for an MBA placement candidate. Use ONLY the data below and cite sessions as S1, S2 (S1 = newest). Give blunt, specific advice and one concrete drill when relevant. Keep answers under 180 words unless asked for more. Note: "confidence" is judged by an AI from the wording only (hedging vs decisive), not from voice; pace, fillers, pauses and pitch are measured separately, and fillers are probably under-counted. If the data cannot support an answer, say what is missing instead of guessing.\n\nDATA\n'+buildCoachDigest();
    const hist=coach.msgs.slice(0,-1).filter(m=>!m.err).slice(-6);
    while(hist.length&&hist[0].role!=='user') hist.shift();
    const sn=coachSnippets(text);
    const msgs=[{role:'user',content:rules},...hist.map(m=>({role:m.role,content:m.content})),{role:'user',content:(sn?'Relevant answer excerpts:\n'+sn+'\n\n':'')+'Question: '+text}];
    const r=await askClaude(msgs,false,false);
    coach.msgs.push({role:'assistant',content:r.text});
    await coachSave();
  }catch(e){ coach.msgs.pop(); coach.msgs.push({role:'assistant',content:'Error: '+e.message,err:true}); }
  coach.busy=false; renderCoachMsgs(); renderCoachHead();
}
function renderCoachMsgs(){
  const box=document.getElementById('coach-msgs'); if(!box) return;
  box.innerHTML=coach.msgs.map(m=>'<div class="bubble '+(m.role==='user'?'user':'ai')+(m.err?' err':'')+'">'+esc(m.content).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</div>').join('')+(coach.busy?'<div class="bubble ai">Thinking…</div>':'');
  box.scrollTop=box.scrollHeight;
  const b=document.getElementById('coach-send'); if(b) b.disabled=coach.busy||coachLeft()<=0;
}
function coachSubmit(){ const i=document.getElementById('coach-in'); const t=(i.value||'').trim(); if(!t||coach.busy) return; i.value=''; coachSend(t); }
function coachAsk(n){ if(!coach.busy) coachSend(COACH_CHIPS[n]); }
function renderCoachHead(){
  const el=document.getElementById('coach-head'); if(!el) return;
  const left=coachLeft();
  el.innerHTML=myProfile.is_admin?'<span class="pill">unlimited</span>':`<span class="pill">${left} of ${coach.limit+coach.bonus} prompts left</span>`;
  const b=document.getElementById('coach-send'); if(b) b.disabled=coach.busy||left<=0;
}
async function renderCoach(keep){
  const el=document.getElementById('main');
  if(!keep){ el.innerHTML='<div class="card">Loading your data…</div>'; await loadCoachData(false); await coachLoadMeta(); }
  const n=(coach.sessions||[]).length, tok=Math.round(buildCoachDigest().length/4);
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Coach chat <span id="coach-head"></span></h3><div class="row"><button class="sec mini" onclick="coachNew()">+ New chat</button><button class="sec mini" onclick="coach.sessions=null;go('coach')">Refresh data</button></div></div>
  <p class="hint">Knows your last ${Math.min(n,40)} sessions (scores, delivery metrics, feedback, growth themes) and pulls matching transcript excerpts only when your question needs them. About ${tok} tokens of context per message.</p>
  ${coach.threads.length?`<details style="margin:8px 0"><summary class="hint" style="cursor:pointer">Chat history (${coach.threads.length})</summary><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">${coach.threads.map((t,i)=>`<button class="sec mini" style="text-align:left;${t.id===coach.rowId?'border-color:var(--accent)':''}" onclick="coachOpen(${i})">${esc(t.title)} <span class="hint">· ${new Date(t.ts).toLocaleDateString()} · ${t.msgs.filter(m=>m.role==='user').length} prompt(s)</span></button>`).join('')}</div></details>`:''}
  <div class="row">${COACH_CHIPS.map((c,i)=>`<button class="sec mini" onclick="coachAsk(${i})">${esc(c)}</button>`).join('')}</div>
  <div id="coach-msgs" class="chat-box"></div>
  <div class="row" style="flex-wrap:nowrap"><textarea id="coach-in" rows="2" placeholder="Ask about your confidence, a weak area, what improved…" style="flex:1;min-height:44px"></textarea><button id="coach-send" onclick="coachSubmit()">Send</button></div></div>`;
  document.getElementById('coach-in').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); coachSubmit(); } });
  renderCoachMsgs(); renderCoachHead();
}

async function renderAdmin(){
  const el=document.getElementById('main');
  el.innerHTML='<div class="card">Loading users…</div>';
  const token=await authToken();
  const r=await fetch('/api/admin',{headers:{'Authorization':'Bearer '+token}});

  if(!r.ok){ el.innerHTML=`<div class="card">${data.error}</div>`; return; }

  <div class="card"><h3>Users (${data.users.length})</h3><table><tr><th>Email</th><th>Credits</th><th>Admin</th><th>Coach prompts</th><th></th></tr>
  ${data.users.map(u=>`<tr><td>${u.email}</td><td>₹${Number(u.credits_inr).toFixed(2)}</td><td>${u.is_admin?'✅':''}</td><td>${Math.max(0,defN+(qm[u.id]||0))} <button class="sec mini" onclick="adminCoachUser('${u.id}',-1)">−</button> <button class="sec mini" onclick="adminCoachUser('${u.id}',1)">+</button></td>
  <td><button class="sec" onclick="adminAdjust('${u.id}',1)">+ Credit</button> <button class="sec" onclick="adminAdjust('${u.id}',-1)">− Credit</button> <button class="sec" onclick="adminViewActivity('${u.id}')">Activity</button></td></tr>
  <tr><td colspan="5"><div id="activity-${u.id}" style="display:none;padding:8px 0"></div></td></tr>`).join('')}

async function adminViewActivity(userId){
  const box=document.getElementById('activity-'+userId);
  if(box.style.display==='block'){ box.style.display='none'; return; }
  box.style.display='block'; box.innerHTML='<p class="hint">Loading…</p>';
  const token=await authToken();
  const r=await fetch('/api/admin?sessionsFor='+userId,{headers:{'Authorization':'Bearer '+token}});
  const data=await r.json();
  if(!r.ok){ box.innerHTML='<p class="hint">Failed to load.</p>'; return; }
  const s=data.sessions||[];
  box.innerHTML = s.length ? s.map(x=>`<div class="sess-row">
    <div class="row" style="justify-content:space-between"><span>${new Date(x.createdAt).toLocaleDateString()} — ${esc(x.kind==='interview'?x.personaLabel:x.topic)}</span><span class="pill">${esc(x.overallScore)}/100</span></div>
    <p class="hint" style="margin:4px 0">${esc(x.summary||'')}</p>
  </div>`).join('') : '<p class="hint">No sessions yet.</p>';
}
async function adminCoachDefault(d){
  const row=await getCfg('coach_config','default'); const cur=row&&!isNaN(row.body_text)?Number(row.body_text):COACH_DEFAULT_LIMIT;
  await setCfg('coach_config','default',Math.max(0,cur+d)); await renderAdmin();
}
async function adminCoachUser(id,d){
  const row=await getCfg('coach_quota',id); const cur=row&&!isNaN(row.body_text)?Number(row.body_text):0;
  await setCfg('coach_quota',id,cur+d); await renderAdmin();
}
async function adminAdjust(userId, sign){
  const amt=prompt((sign>0?"How much to ADD (₹)?":"How much to SUBTRACT (₹)?")+" e.g. 50");
  if(!amt || isNaN(amt)) return;
  const token=await authToken();
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({userId,addCredits:sign*Number(amt)})});
  if(!r.ok){ alert('Failed'); return; }
  await renderAdmin();
}

async function render(){
  if(tab==='dashboard') await renderHome();
  else if(tab==='interview') renderInterview();
  else if(tab==='audio') renderAudio();
  else if(tab==='bank') renderBank();
  else if(tab==='history') await renderHistory();
  else if(tab==='reads') await renderReads();
  else if(tab==='shl') renderSHL();
  else if(tab==='coach') await renderCoach();
  else if(tab==='admin') await renderAdmin();
}
async function boot(){
  try{
    const {data:{session}}=await supa.auth.getSession();
    if(!session){ document.getElementById('authScreen').style.display='block'; document.getElementById('appScreen').style.display='none'; return; }
    currentUser=session.user;
    await refreshCredits();
    if(!myProfile) return; // refreshCredits already showed a fatal banner explaining why
    document.getElementById('authScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    document.getElementById('voiceBtn').textContent=voiceOn?'🔊 On':'🔊 Off';
    document.getElementById('voiceSel').value=voiceName;
    buildNav(); await loadPersonas(); await render();
  }catch(e){
    showFatal('Startup failed: '+(e.message||e));
    document.getElementById('authScreen').style.display='block';
  }
}
